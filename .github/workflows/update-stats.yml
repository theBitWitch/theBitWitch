name: Update Stats

on:
  workflow_dispatch:       # nur manuell per Knopfdruck auslösbar

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Abhängigkeiten installieren
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Crawler ausführen
        run: python crawl_stats.py
        env:
          CI: true

      - name: stats.json committen (wenn geändert)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet || git commit -m "chore: stats.json automatisch aktualisiert"
          git push
